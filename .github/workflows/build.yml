name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Validar y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar Java 17 y caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Probar lógica de licencias
        run: deno test supabase/functions/license-api/logic.test.ts

      - name: Verificar panel admin desplegado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://zzlvupunploglgxbgllm.supabase.co/functions/v1/density-reset-admin"

          check_200() {
            local url="$1"
            local out="$2"
            local status
            status="$(curl --retry 3 --retry-delay 2 --fail-with-body -sS -o "$out" -w '%{http_code}' "$url")"
            if [ "$status" != "200" ]; then
              echo "Esperaba HTTP 200 en $url y recibí $status"
              cat "$out" || true
              exit 1
            fi
          }

          check_200 "$BASE" /tmp/admin.html
          grep -Fq '<title>Density Reset Admin</title>' /tmp/admin.html
          grep -Fq 'Entrar con GitHub' /tmp/admin.html

          check_200 "$BASE/styles.css" /tmp/styles.css
          grep -Fq '.auth-card' /tmp/styles.css

          check_200 "$BASE/app.js" /tmp/app.js
          grep -Fq 'loadDashboard' /tmp/app.js

          check_200 "$BASE/github-auth.js" /tmp/github-auth.js
          grep -Fq 'signInWithOAuth' /tmp/github-auth.js

          check_200 "$BASE/config.js" /tmp/config.js
          grep -Fq 'LICENSE_API_URL' /tmp/config.js

          check_200 "$BASE/health" /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json

      - name: Dar permiso al Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar lint, pruebas y compilación debug
        run: ./gradlew clean lintDebug testDebugUnitTest assembleDebug

      - name: Preparar nombre de distribución
        run: cp app/build/outputs/apk/debug/app-debug.apk DensityReset-Zaid-v1.4.0.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DensityReset-Zaid-v1.4.0-apk
          path: DensityReset-Zaid-v1.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release 1.4.0
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, 'release: Density Reset 1.4.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.4.0
          DensityReset-Zaid-v1.4.0.apk#DensityReset-Zaid-v1.4.0.apk
          --target "$GITHUB_SHA"
          --title "Density Reset 1.4.0 — licencias y panel admin"
          --notes-file RELEASE_NOTES_1.4.0.md
