name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Validar y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar Java 17 y caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Probar lógica de licencias
        run: deno test supabase/functions/license-api/logic.test.ts

      - name: Verificar panel admin desplegado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://zzlvupunploglgxbgllm.supabase.co/functions/v1/density-reset-admin"
          FRONTEND="https://density-reset-admin.vercel.app/"

          check_200() {
            local url="$1"
            local out="$2"
            local status
            status="$(curl -L --retry 3 --retry-delay 2 -sS -o "$out" -w '%{http_code}' "$url")"
            test "$status" = "200" || { echo "HTTP $status en $url"; cat "$out" || true; exit 1; }
            test -s "$out" || { echo "Respuesta vacía en $url"; exit 1; }
          }

          check_200 "$BASE/health" /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          grep -Fq '"service":"density-reset-admin"' /tmp/health.json
          grep -Fq "\"frontend\":\"$FRONTEND\"" /tmp/health.json

          check_200 "$BASE" /tmp/admin.html
          grep -Fiq 'Density Reset' /tmp/admin.html
          grep -Fiq '<html' /tmp/admin.html

      - name: Dar permiso al Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar lint, pruebas y compilación debug
        run: ./gradlew clean lintDebug testDebugUnitTest assembleDebug

      - name: Leer versión
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          print("name=" + re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1))
          PY

      - name: Preparar nombre de distribución debug
        run: cp app/build/outputs/apk/debug/app-debug.apk "DensityReset-Zaid-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: DensityReset-Zaid-v${{ steps.version.outputs.name }}-debug-apk
          path: DensityReset-Zaid-v${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
          retention-days: 30
