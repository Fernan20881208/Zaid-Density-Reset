name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar Java 17 y caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permiso al Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew clean assembleDebug

      - name: Preparar nombre de distribución
        run: cp app/build/outputs/apk/debug/app-debug.apk DensityReset-Zaid-v1.2.0.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DensityReset-Zaid-v1.2.0-apk
          path: DensityReset-Zaid-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release 1.2.0
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, 'release: Density Reset 1.2.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.2.0
          DensityReset-Zaid-v1.2.0.apk#DensityReset-Zaid-v1.2.0.apk
          --target "$GITHUB_SHA"
          --title "Density Reset 1.2.0 — DPI múltiple"
          --notes-file RELEASE_NOTES_1.2.0.md
