name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Validar y compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar Java 17 y caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Probar lógica de licencias
        run: deno test supabase/functions/license-api/logic.test.ts

      - name: Verificar panel admin desplegado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://zzlvupunploglgxbgllm.supabase.co/functions/v1/density-reset-admin"

          status="$(curl --retry 3 --retry-delay 2 -sS -o /tmp/admin.html -w '%{http_code}' "$BASE")"
          test "$status" = "200" || { echo "Panel HTTP $status"; cat /tmp/admin.html || true; exit 1; }
          grep -Fq '<title>Density Reset Admin</title>' /tmp/admin.html
          grep -Fq 'Entrar con GitHub' /tmp/admin.html
          grep -Fq 'Generar licencia' /tmp/admin.html
          grep -Fq 'signInWithOAuth' /tmp/admin.html
          grep -Fq '/admin/licenses/create' /tmp/admin.html

          status="$(curl --retry 3 --retry-delay 2 -sS -o /tmp/health.json -w '%{http_code}' "$BASE/health")"
          test "$status" = "200" || { echo "Health HTTP $status"; cat /tmp/health.json || true; exit 1; }
          grep -Fq '"ok":true' /tmp/health.json

      - name: Dar permiso al Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar lint, pruebas y compilación debug
        run: ./gradlew clean lintDebug testDebugUnitTest assembleDebug

      - name: Preparar nombre de distribución
        run: cp app/build/outputs/apk/debug/app-debug.apk DensityReset-Zaid-v1.4.0.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DensityReset-Zaid-v1.4.0-apk
          path: DensityReset-Zaid-v1.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release 1.4.0
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, 'release: Density Reset 1.4.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.4.0
          DensityReset-Zaid-v1.4.0.apk#DensityReset-Zaid-v1.4.0.apk
          --target "$GITHUB_SHA"
          --title "Density Reset 1.4.0 — licencias y panel admin"
          --notes-file RELEASE_NOTES_1.4.0.md
