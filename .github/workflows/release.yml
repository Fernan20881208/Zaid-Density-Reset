name: Publicar Density Reset

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: density-reset-release
  cancel-in-progress: false

jobs:
  release:
    name: Build y publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Leer versión
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          code = re.search(r"versionCode\s*=\s*(\d+)", text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("No se pudo leer versionCode/versionName")
          print(f"code={code.group(1)}")
          print(f"name={name.group(1)}")
          print(f"tag=v{name.group(1)}")
          PY

      - name: Comprobar si la versión ya fue publicada
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La Release $TAG ya existe; no se vuelve a publicar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Obtener firma persistente con GitHub OIDC
        if: steps.status.outputs.skip != 'true'
        env:
          SIGNING_ENDPOINT: https://zzlvupunploglgxbgllm.supabase.co/functions/v1/release-signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub OIDC no está disponible"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "Falta token para GitHub OIDC"; exit 1; }

          OIDC_RESPONSE="$(curl --fail --silent --show-error --location \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=density-reset-release")"
          OIDC_TOKEN="$(jq -er '.value' <<< "$OIDC_RESPONSE")"

          BUNDLE="$(curl --fail --silent --show-error --location \
            --request POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "$SIGNING_ENDPOINT")"
          jq -e '.success == true' <<< "$BUNDLE" >/dev/null

          KEYSTORE_B64="$(jq -er '.keystore_base64' <<< "$BUNDLE")"
          STORE_PASSWORD="$(jq -er '.store_password' <<< "$BUNDLE")"
          KEY_ALIAS="$(jq -er '.key_alias' <<< "$BUNDLE")"
          KEY_PASSWORD="$(jq -er '.key_password' <<< "$BUNDLE")"
          EXPECTED_CERT_SHA256="$(jq -er '.cert_sha256' <<< "$BUNDLE" | tr '[:upper:]' '[:lower:]')"

          test "${#EXPECTED_CERT_SHA256}" -eq 64
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/density-reset.keystore"
          test -s "$RUNNER_TEMP/density-reset.keystore"

          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/density-reset.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "EXPECTED_CERT_SHA256=$EXPECTED_CERT_SHA256"
          } >> "$GITHUB_ENV"

          unset KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD BUNDLE OIDC_TOKEN OIDC_RESPONSE
          echo "Firma Android persistente obtenida mediante OIDC."

      - name: Compilar y probar Release firmada
        if: steps.status.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean lintDebug testDebugUnitTest assembleRelease

      - name: Verificar APK y preparar metadata obligatoria
        if: steps.status.outputs.skip != 'true'
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          APK="DensityReset-v${VERSION_NAME}.apk"
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          SIGNER_INFO="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNER_INFO"
          CERT_SHA256="$(printf '%s\n' "$SIGNER_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "${#CERT_SHA256}" -eq 64
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "El certificado del APK no coincide con la firma persistente esperada."
            exit 1
          }

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          test "${#SHA256}" -eq 64

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkAsset "$APK" \
            --arg sha256 "$SHA256" \
            --argjson minVersionCode "$VERSION_CODE" \
            '{versionCode:$versionCode,versionName:$versionName,apkAsset:$apkAsset,sha256:$sha256,mandatory:true,minVersionCode:$minVersionCode}' \
            > update.json

          jq -e ".versionCode == $VERSION_CODE and .minVersionCode == $VERSION_CODE and .mandatory == true" update.json >/dev/null
          test "$(jq -r .sha256 update.json)" = "$SHA256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Crear tag de versión
        if: steps.status.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            test "$TAG_SHA" = "$GITHUB_SHA" || {
              echo "El tag $TAG ya existe pero apunta a $TAG_SHA, no a $GITHUB_SHA"
              exit 1
            }
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Crear Release draft, subir assets y publicar atómicamente
        if: steps.status.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.assets.outputs.apk }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag=false >/dev/null 2>&1 || true
          }
          trap cleanup ERR

          NOTES="RELEASE_NOTES_${VERSION_NAME}.md"
          if [ -s "$NOTES" ]; then
            cp "$NOTES" /tmp/release-notes.md
          else
            printf '# Density Reset %s\n' "$VERSION_NAME" > /tmp/release-notes.md
          fi

          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "Density Reset ${VERSION_NAME}" \
            --notes-file /tmp/release-notes.md \
            "$APK#${APK}" \
            "update.json#update.json"

          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK" <<< "$ASSETS"
          grep -Fxq "update.json" <<< "$ASSETS"

          gh release edit "$TAG" --draft=false --latest
          trap - ERR

      - name: Resumen de integridad
        if: steps.status.outputs.skip != 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          CERT_SHA256: ${{ steps.assets.outputs.cert_sha256 }}
        run: |
          {
            echo "### Density Reset ${VERSION_NAME}"
            echo "- versionCode: ${VERSION_CODE}"
            echo "- APK SHA-256: \`${SHA256}\`"
            echo "- Signing certificate SHA-256: \`${CERT_SHA256}\`"
            echo "- Assets: APK + update.json"
            echo "- mandatory=true, minVersionCode=${VERSION_CODE}"
            echo "- signing mode: Supabase Vault + GitHub OIDC"
          } >> "$GITHUB_STEP_SUMMARY"
