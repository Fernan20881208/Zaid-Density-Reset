name: Publicar Density Reset

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: density-reset-release
  cancel-in-progress: false

jobs:
  release:
    name: Build y publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Leer versión
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          code = re.search(r"versionCode\s*=\s*(\d+)", text)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("No se pudo leer versionCode/versionName")
          print(f"code={code.group(1)}")
          print(f"name={name.group(1)}")
          print(f"tag=v{name.group(1)}")
          PY

      - name: Comprobar si la versión ya fue publicada
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La Release $TAG ya existe; no se vuelve a publicar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determinar modo de firma
        if: steps.status.outputs.skip != 'true'
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/density-reset.keystore"
            test -s "$RUNNER_TEMP/density-reset.keystore"
            echo "Se usará la firma release persistente."
          else
            echo "mode=transition-debug" >> "$GITHUB_OUTPUT"
            echo "Secrets de release ausentes: se publicará el build de transición firmado con debug."
          fi

      - name: Compilar y probar Release firmada
        if: steps.status.outputs.skip != 'true' && steps.signing.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/density-reset.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean lintDebug testDebugUnitTest assembleRelease

      - name: Compilar y probar build de transición
        if: steps.status.outputs.skip != 'true' && steps.signing.outputs.mode == 'transition-debug'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean lintDebug testDebugUnitTest assembleDebug

      - name: Verificar APK y preparar metadata obligatoria
        if: steps.status.outputs.skip != 'true'
        id: assets
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_MODE" = "release" ]; then
            SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          APK="DensityReset-v${VERSION_NAME}.apk"
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          test "${#SHA256}" -eq 64

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkAsset "$APK" \
            --arg sha256 "$SHA256" \
            --argjson minVersionCode "$VERSION_CODE" \
            '{versionCode:$versionCode,versionName:$versionName,apkAsset:$apkAsset,sha256:$sha256,mandatory:true,minVersionCode:$minVersionCode}' \
            > update.json

          jq -e ".versionCode == $VERSION_CODE and .minVersionCode == $VERSION_CODE and .mandatory == true" update.json >/dev/null
          test "$(jq -r .sha256 update.json)" = "$SHA256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Crear tag de versión
        if: steps.status.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            test "$TAG_SHA" = "$GITHUB_SHA" || {
              echo "El tag $TAG ya existe pero apunta a $TAG_SHA, no a $GITHUB_SHA";
              exit 1;
            }
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Crear Release draft, subir assets y publicar atómicamente
        if: steps.status.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.assets.outputs.apk }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag=false >/dev/null 2>&1 || true
          }
          trap cleanup ERR

          NOTES="RELEASE_NOTES_${VERSION_NAME}.md"
          EXTRA=""
          if [ "$SIGNING_MODE" = "transition-debug" ]; then
            EXTRA=$'\n\n> Build de transición: si Android reporta firma incompatible con una instalación anterior, desinstala la versión anterior e instala esta una sola vez.'
          fi

          if [ -s "$NOTES" ]; then
            cp "$NOTES" /tmp/release-notes.md
          else
            printf '# Density Reset %s\n' "$VERSION_NAME" > /tmp/release-notes.md
          fi
          printf '%s\n' "$EXTRA" >> /tmp/release-notes.md

          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "Density Reset ${VERSION_NAME}" \
            --notes-file /tmp/release-notes.md \
            "$APK#${APK}" \
            "update.json#update.json"

          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK" <<< "$ASSETS"
          grep -Fxq "update.json" <<< "$ASSETS"

          gh release edit "$TAG" --draft=false --latest
          trap - ERR

      - name: Resumen de integridad
        if: steps.status.outputs.skip != 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          {
            echo "### Density Reset ${VERSION_NAME}"
            echo "- versionCode: ${VERSION_CODE}"
            echo "- SHA-256: \`${SHA256}\`"
            echo "- Assets: APK + update.json"
            echo "- mandatory=true, minVersionCode=${VERSION_CODE}"
            echo "- signing mode: ${SIGNING_MODE}"
          } >> "$GITHUB_STEP_SUMMARY"
