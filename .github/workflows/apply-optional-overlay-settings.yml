          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"No se encontró bloque esperado en {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

