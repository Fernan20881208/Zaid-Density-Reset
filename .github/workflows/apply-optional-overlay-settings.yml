name: Aplicar overlay opcional

on:
  push:
    branches:
      - agent/optional-overlay-opacity-v161
    paths:
      - .github/workflows/apply-optional-overlay-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/optional-overlay-opacity-v161
          fetch-depth: 0

      - name: Aplicar cambios
        run: python3 .github/scripts/apply_optional_overlay_settings.py

      - name: Commit de implementación
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zaid.nvr"
          git config user.email "utegfer@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make performance overlay optional and configurable"
          git push origin HEAD:agent/optional-overlay-opacity-v161
