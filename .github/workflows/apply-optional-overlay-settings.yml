name: Aplicar overlay opcional

on:
  push:
    branches:
      - agent/optional-overlay-opacity-v161
    paths:
      - .github/workflows/apply-optional-overlay-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/optional-overlay-opacity-v161
          fetch-depth: 0

      - name: Aplicar cambios
        shell: bash
