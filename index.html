<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="color-scheme" content="dark">
  <title>Density Reset · Admin Login</title>
  <link rel="stylesheet" href="./admin-site/styles.css">
  <style>
    body{min-height:100vh}.login-only{min-height:100vh;display:grid;place-items:center;padding:18px}.login-card{position:relative;overflow:hidden}.login-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(167,238,246,.06),transparent 42%);pointer-events:none}.login-title{font-size:1.85rem;margin:.35rem 0 .25rem}.login-subtitle{margin:0 0 22px;color:var(--muted);line-height:1.5}.login-status{margin:0;padding:.75rem .85rem;border:1px solid rgba(255,184,179,.24);border-radius:14px;background:rgba(105,36,48,.45);color:var(--bad);font-size:.82rem}.login-status.success{border-color:rgba(155,240,189,.24);background:rgba(35,92,59,.38);color:var(--good)}
  </style>
</head>
<body>
  <div class="ambient a"></div><div class="ambient b"></div>
  <main class="login-only">
    <section class="glass login-card">
      <div class="brand">
        <div class="mark">DR</div>
        <div><p class="eyebrow">DENSITY RESET</p><h1 class="login-title">Acceso Admin</h1></div>
      </div>
      <p class="login-subtitle">Inicia sesión para abrir el panel privado de keys.</p>
      <form id="loginForm" class="stack">
        <label><span>Correo</span><input id="email" type="email" autocomplete="username" placeholder="tu@correo.com" required></label>
        <label><span>Contraseña</span><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
        <button id="loginButton" class="primary full" type="submit">Entrar</button>
        <button id="githubLogin" class="ghost full" type="button">Entrar con GitHub</button>
        <p id="loginError" class="login-status" hidden></p>
      </form>
    </section>
  </main>
  <script type="module" src="./login.js"></script>
</body>
</html>
